<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Site em Desenvolvimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient( #0302029f, #000000);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: black;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .construction-icon {
      width: 130px;
      height: 130px;
      margin: 0 auto 30px;
      animation: pulse 2s infinite ease-in-out;
    }

    .construction-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: 600;
    }

    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .progress-container {
      width: 100%;
      height: 22px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      overflow: hidden;
      margin-bottom: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 65%;
      background: linear-gradient(270deg, #000000, #858585, #000000);
      background-size: 600% 100%;
      animation: progressBarMove 3s linear infinite;
      border-radius: 30px;
    }

    .contact {
      font-size: 1rem;
      color: #aaa;
      margin-top: 20px;
    }

    .contact a {
      color: #d0ff00;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .notify-button {
      margin-top: 10px;
      background: #eeff00;
      color: #000;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .notify-button:hover {
      background: #d0ff00;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes progressBarMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      .construction-icon {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="construction-icon">
      <img src="../img/https___dev-to-uploads.s3.amazonaws.com_uploads_articles_q2lvt4j8u210kgo3avqh.webp" alt="Site em construção" />
    </div>
    <h1>Site em Desenvolvimento</h1>
    <p>
      Nosso site está passando por melhorias. Em breve, você poderá navegar em uma nova experiência, mais rápida, intuitiva e cheia de novidades.
    </p>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <p>Estamos quase prontos! Fique ligado.</p>

    <button class="notify-button">Voltar</button>

    <div class="contact">
      Dúvidas ou suporte? Fale com a gente em:
      <br />
      <a href="mailto:viniciusbubumguloso@empresa.com">viniciusbubumguloso@empresa.com</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.getElementById('progress-bar');
      let width = 65;

      setInterval(() => {
        width += Math.floor(Math.random() * 5) + 1;
        if (width > 100) width = 5;
        progressBar.style.width = width + '%';
      }, 2500);
    });
    document.querySelector(".notify-button").addEventListener("click", function(){
      window.location.href = "../html/info_computadores.html";
    })
  </script>
</body>
</html>
