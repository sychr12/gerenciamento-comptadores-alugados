services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gerenciamento}
      PGUSER: ${POSTGRES_USER:-gerenciador}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env a partir do .env.example}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gerenciamento}
      POSTGRES_USER: ${POSTGRES_USER:-gerenciador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env a partir do .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./gerenciador3/bancotxt/banco_sistema_pricipal:/docker-entrypoint-initdb.d/01-computadores.sql:ro
      - ./gerenciador3/bancotxt/banco_login:/docker-entrypoint-initdb.d/02-usuarios.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
